name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASE_LOCK_SHA256: "54553a9333abf06be92c7ca11fd1b35b1548ac7f50a7fb196897b4691ac73f5e"
  RELEASE_SIGNER_FINGERPRINT: "15DD2B380EC7BA67E25BDACB1C197479AAD3062B"
  RELEASE_SIGNER_LOGIN: "splicer3"
  RELEASE_SIGNER_NAME: "Matteo Di Iorio"
  RELEASE_SIGNER_EMAIL: "matteo.di.iorio@icloud.com"

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare release candidate
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source-commit: ${{ steps.identity.outputs.source-commit }}
      version: ${{ steps.identity.outputs.version }}
      wheel-name: ${{ steps.identity.outputs.wheel-name }}
      sdist-name: ${{ steps.identity.outputs.sdist-name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inspectrt-ci-distributions
          path: ${{ runner.temp }}/inspectrt-release-input

      - name: Verify version and source identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          SOURCE_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          python3 - "$EVENT_NAME" "$REF_NAME" "$VERSION" <<'PY'
          import re
          import sys

          event, ref, version = sys.argv[1:]
          semver = re.compile(
              r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
              r"(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )
          if semver.fullmatch(version) is None:
              raise SystemExit(f"package version is not SemVer: {version!r}")
          if event == "push" and ref != f"v{version}":
              raise SystemExit(
                  f"tag/version mismatch: tag={ref!r}, version={version!r}"
              )
          PY
          {
            printf 'source-commit=%s\n' "$SOURCE_COMMIT"
            printf 'version=%s\n' "$VERSION"
            printf 'wheel-name=inspectrt-%s-py3-none-any.whl\n' "$VERSION"
            printf 'sdist-name=inspectrt-%s.tar.gz\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Audit distributions and release lock
        shell: bash
        env:
          SDIST_NAME: ${{ steps.identity.outputs.sdist-name }}
          WHEEL_NAME: ${{ steps.identity.outputs.wheel-name }}
        run: |
          set -euo pipefail
          INPUT_ROOT="$RUNNER_TEMP/inspectrt-release-input"
          python3 - "$INPUT_ROOT" "$WHEEL_NAME" "$SDIST_NAME" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          expected = {sys.argv[2], sys.argv[3]}
          actual = {path.name for path in root.iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"distribution artifact inventory mismatch: {sorted(actual)!r}"
              )
          if any(not path.is_file() or path.is_symlink() for path in root.iterdir()):
              raise SystemExit("distribution artifact contains a non-regular file")
          PY
          python3 scripts/verify_distribution.py \
            "$INPUT_ROOT/$WHEEL_NAME" \
            "$INPUT_ROOT/$SDIST_NAME"
          printf '%s  uv.lock\n' "$RELEASE_LOCK_SHA256" | \
            sha256sum --check --strict

      - name: Prepare deterministic release files
        shell: bash
        env:
          SDIST_NAME: ${{ steps.identity.outputs.sdist-name }}
          VERSION: ${{ steps.identity.outputs.version }}
          WHEEL_NAME: ${{ steps.identity.outputs.wheel-name }}
        run: |
          set -euo pipefail
          INPUT_ROOT="$RUNNER_TEMP/inspectrt-release-input"
          CANDIDATE_ROOT="$RUNNER_TEMP/inspectrt-release-candidate"
          mkdir "$CANDIDATE_ROOT"
          cp -- "$INPUT_ROOT/$WHEEL_NAME" "$CANDIDATE_ROOT/$WHEEL_NAME"
          cp -- "$INPUT_ROOT/$SDIST_NAME" "$CANDIDATE_ROOT/$SDIST_NAME"
          python3 scripts/extract_release_notes.py CHANGELOG.md "$VERSION" \
            > "$CANDIDATE_ROOT/release-notes.md"
          (
            cd "$CANDIDATE_ROOT"
            LC_ALL=C sha256sum "$WHEEL_NAME" "$SDIST_NAME" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          python3 - "$CANDIDATE_ROOT" "$WHEEL_NAME" "$SDIST_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          wheel, sdist = sys.argv[2:]
          expected = {wheel, sdist, "SHA256SUMS", "release-notes.md"}
          actual = {path.name for path in root.iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"release candidate inventory mismatch: {sorted(actual)!r}"
              )
          if any(not path.is_file() or path.is_symlink() for path in root.iterdir()):
              raise SystemExit("release candidate contains a non-regular file")
          checksum = (root / "SHA256SUMS").read_text(encoding="ascii")
          pattern = rf"[0-9a-f]{{64}}  {re.escape(wheel)}\n"
          pattern += rf"[0-9a-f]{{64}}  {re.escape(sdist)}\n"
          if re.fullmatch(pattern, checksum) is None:
              raise SystemExit("SHA256SUMS format or order is invalid")
          notes = (root / "release-notes.md").read_bytes()
          if not notes or not notes.endswith(b"\n") or notes.endswith(b"\n\n"):
              raise SystemExit("release notes are empty or not LF-terminated")
          PY

      - name: Upload release candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspectrt-release-candidate
          path: |
            ${{ runner.temp }}/inspectrt-release-candidate/${{ steps.identity.outputs.wheel-name }}
            ${{ runner.temp }}/inspectrt-release-candidate/${{ steps.identity.outputs.sdist-name }}
            ${{ runner.temp }}/inspectrt-release-candidate/SHA256SUMS
            ${{ runner.temp }}/inspectrt-release-candidate/release-notes.md
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          overwrite: false

      - name: Remove temporary release paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil

          runner = Path(os.environ["RUNNER_TEMP"]).resolve()
          for name in ("inspectrt-release-input", "inspectrt-release-candidate"):
              root = (runner / name).resolve()
              if root.parent != runner or root.name != name:
                  raise SystemExit(f"refusing to remove unexpected path: {root}")
              if root.exists():
                  shutil.rmtree(root)
          PY

  tag-gate:
    name: Verify release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      verified_tag_object_sha: ${{ steps.verify.outputs.verified_tag_object_sha }}
    steps:
      - name: Verify immutable release identities and current repository state
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["REPOSITORY"]
          source_commit = os.environ["SOURCE_COMMIT"]
          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          fingerprint = os.environ["RELEASE_SIGNER_FINGERPRINT"]
          signer_login = os.environ["RELEASE_SIGNER_LOGIN"]
          signer_name = os.environ["RELEASE_SIGNER_NAME"]
          signer_email = os.environ["RELEASE_SIGNER_EMAIL"]

          def api(endpoint: str):
              result = subprocess.run(
                  ["gh", "api", "--method", "GET", endpoint],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              )
              return json.loads(result.stdout)

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          def require_verified(record: dict, label: str) -> None:
              verification = record.get("verification", {})
              require(verification.get("verified") is True, f"{label} is unverified")
              require(
                  verification.get("reason") == "valid",
                  f"{label} verification reason is not valid",
              )
              signature = verification.get("signature")
              require(isinstance(signature, str) and signature, f"{label} has no signature")
              packets = subprocess.run(
                  ["gpg", "--batch", "--list-packets"],
                  input=signature,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              require(packets.returncode == 0, f"cannot inspect {label} signature")
              issuers = set(
                  re.findall(r"issuer fpr v4 ([0-9A-F]{40})", packets.stdout)
              )
              require(issuers == {fingerprint}, f"{label} signer fingerprint mismatch")

          def require_release_absent() -> None:
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "--include",
                      "--silent",
                      f"repos/{repository}/releases/tags/{tag}",
                  ],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              statuses = re.findall(
                  r"^HTTP/\S+ ([0-9]{3})\b", result.stdout, re.MULTILINE
              )
              require(
                  len(statuses) == 1,
                  "release-by-tag lookup returned an invalid HTTP status count",
              )
              status = int(statuses[0])
              if status == 200:
                  raise SystemExit("a published release already uses this tag")
              require(
                  status == 404 and result.returncode == 1,
                  f"release-by-tag lookup failed with HTTP {status}"
                  f" and exit {result.returncode}",
              )

              owner, name = repository.split("/", 1)
              query = (
                  "query ReleaseByTag($owner:String!,$name:String!,$tagName:String!){"
                  "repository(owner:$owner,name:$name){"
                  "release(tagName:$tagName){databaseId isDraft tagName}}}"
              )
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "graphql",
                      "--method",
                      "POST",
                      "--raw-field",
                      f"query={query}",
                      "--raw-field",
                      f"owner={owner}",
                      "--raw-field",
                      f"name={name}",
                      "--raw-field",
                      f"tagName={tag}",
                  ],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              require(result.returncode == 0, "draft release lookup failed")
              try:
                  payload = json.loads(result.stdout)
              except json.JSONDecodeError:
                  raise SystemExit("draft release lookup returned malformed JSON")
              require(not payload.get("errors"), "draft release lookup returned errors")
              repository_record = payload.get("data", {}).get("repository")
              require(
                  isinstance(repository_record, dict)
                  and "release" in repository_record,
                  "draft release lookup returned malformed data",
              )
              require(
                  repository_record["release"] is None,
                  "a draft or published release already uses this tag",
              )

          require(tag == f"v{version}", "tag/version mismatch")
          repo = api(f"repos/{repository}")
          require(repo.get("visibility") == "public", "repository is not public")
          require(repo.get("private") is False, "repository private flag is set")
          require(repo.get("default_branch") == "main", "default branch is not main")

          ref = api(f"repos/{repository}/git/ref/tags/{tag}")
          require(ref.get("ref") == f"refs/tags/{tag}", "tag ref mismatch")
          require(ref.get("object", {}).get("type") == "tag", "tag is lightweight")
          tag_object_sha = ref.get("object", {}).get("sha")
          require(
              isinstance(tag_object_sha, str)
              and re.fullmatch(r"[0-9a-f]{40}", tag_object_sha) is not None,
              "annotated tag object SHA is invalid",
          )
          tag_object = api(f"repos/{repository}/git/tags/{tag_object_sha}")
          require(tag_object.get("sha") == tag_object_sha, "tag object SHA mismatch")
          require(tag_object.get("tag") == tag, "annotated tag name mismatch")
          require(
              tag_object.get("tagger", {}).get("name") == signer_name
              and tag_object.get("tagger", {}).get("email") == signer_email,
              "annotated tagger identity mismatch",
          )
          require_verified(tag_object, "tag")
          require(
              tag_object.get("object", {}).get("type") == "commit",
              "tag does not target a commit",
          )
          require(
              tag_object.get("object", {}).get("sha") == source_commit,
              "tag target differs from prepared commit",
          )

          commit = api(f"repos/{repository}/commits/{source_commit}")
          require(commit.get("sha") == source_commit, "commit identity mismatch")
          require(
              commit.get("author", {}).get("login") == signer_login
              and commit.get("committer", {}).get("login") == signer_login,
              "commit account identity mismatch",
          )
          commit_record = commit.get("commit", {})
          expected_identity = {"name": signer_name, "email": signer_email}
          for field in ("author", "committer"):
              identity = commit_record.get(field, {})
              require(
                  {key: identity.get(key) for key in expected_identity}
                  == expected_identity,
                  f"commit {field} identity mismatch",
              )
          require_verified(commit_record, "commit")

          main = api(f"repos/{repository}/git/ref/heads/main")
          require(
              main.get("object", {}).get("sha") == source_commit,
              "current main differs from release commit",
          )
          require_release_absent()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              print(f"verified_tag_object_sha={tag_object_sha}", file=stream)
          print("release tag gate passed")
          PY

  publish:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, tag-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download prepared release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inspectrt-release-candidate
          path: ${{ runner.temp }}/inspectrt-release-candidate

      - name: Recheck assets and mutable release gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SDIST_NAME: ${{ needs.prepare.outputs.sdist-name }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
          TAG: ${{ github.ref_name }}
          VERIFIED_TAG_OBJECT_SHA: ${{ needs.tag-gate.outputs.verified_tag_object_sha }}
          WHEEL_NAME: ${{ needs.prepare.outputs.wheel-name }}
        run: |
          set -euo pipefail
          CANDIDATE_ROOT="$RUNNER_TEMP/inspectrt-release-candidate"
          python3 - "$CANDIDATE_ROOT" "$WHEEL_NAME" "$SDIST_NAME" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          expected = {sys.argv[2], sys.argv[3], "SHA256SUMS", "release-notes.md"}
          actual = {path.name for path in root.iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"prepared release inventory mismatch: {sorted(actual)!r}"
              )
          if any(not path.is_file() or path.is_symlink() for path in root.iterdir()):
              raise SystemExit("prepared release contains a non-regular file")
          notes = (root / "release-notes.md").read_bytes()
          if not notes or not notes.endswith(b"\n") or notes.endswith(b"\n\n"):
              raise SystemExit("release notes are empty or not LF-terminated")
          PY
          (
            cd "$CANDIDATE_ROOT"
            sha256sum --check --strict SHA256SUMS
          )
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["REPOSITORY"]
          source_commit = os.environ["SOURCE_COMMIT"]
          tag = os.environ["TAG"]
          tag_object_sha = os.environ["VERIFIED_TAG_OBJECT_SHA"]
          fingerprint = os.environ["RELEASE_SIGNER_FINGERPRINT"]
          signer_name = os.environ["RELEASE_SIGNER_NAME"]
          signer_email = os.environ["RELEASE_SIGNER_EMAIL"]

          def api(endpoint: str):
              result = subprocess.run(
                  ["gh", "api", "--method", "GET", endpoint],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              )
              return json.loads(result.stdout)

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          def require_verified(record: dict, label: str) -> None:
              verification = record.get("verification", {})
              require(verification.get("verified") is True, f"{label} is unverified")
              require(
                  verification.get("reason") == "valid",
                  f"{label} verification reason is not valid",
              )
              signature = verification.get("signature")
              require(isinstance(signature, str) and signature, f"{label} has no signature")
              packets = subprocess.run(
                  ["gpg", "--batch", "--list-packets"],
                  input=signature,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              require(packets.returncode == 0, f"cannot inspect {label} signature")
              issuers = set(
                  re.findall(r"issuer fpr v4 ([0-9A-F]{40})", packets.stdout)
              )
              require(issuers == {fingerprint}, f"{label} signer fingerprint mismatch")

          def require_release_absent() -> None:
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "--include",
                      "--silent",
                      f"repos/{repository}/releases/tags/{tag}",
                  ],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              statuses = re.findall(
                  r"^HTTP/\S+ ([0-9]{3})\b", result.stdout, re.MULTILINE
              )
              require(
                  len(statuses) == 1,
                  "release-by-tag lookup returned an invalid HTTP status count",
              )
              status = int(statuses[0])
              if status == 200:
                  raise SystemExit("a published release already uses this tag")
              require(
                  status == 404 and result.returncode == 1,
                  f"release-by-tag lookup failed with HTTP {status}"
                  f" and exit {result.returncode}",
              )

              owner, name = repository.split("/", 1)
              query = (
                  "query ReleaseByTag($owner:String!,$name:String!,$tagName:String!){"
                  "repository(owner:$owner,name:$name){"
                  "release(tagName:$tagName){databaseId isDraft tagName}}}"
              )
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "graphql",
                      "--method",
                      "POST",
                      "--raw-field",
                      f"query={query}",
                      "--raw-field",
                      f"owner={owner}",
                      "--raw-field",
                      f"name={name}",
                      "--raw-field",
                      f"tagName={tag}",
                  ],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              require(result.returncode == 0, "draft release lookup failed")
              try:
                  payload = json.loads(result.stdout)
              except json.JSONDecodeError:
                  raise SystemExit("draft release lookup returned malformed JSON")
              require(not payload.get("errors"), "draft release lookup returned errors")
              repository_record = payload.get("data", {}).get("repository")
              require(
                  isinstance(repository_record, dict)
                  and "release" in repository_record,
                  "draft release lookup returned malformed data",
              )
              require(
                  repository_record["release"] is None,
                  "a draft or published release already uses this tag",
              )

          repo = api(f"repos/{repository}")
          require(
              repo.get("visibility") == "public" and repo.get("private") is False,
              "repository is not public",
          )
          require(repo.get("default_branch") == "main", "default branch is not main")
          require(
              re.fullmatch(r"[0-9a-f]{40}", tag_object_sha) is not None,
              "verified tag object SHA is invalid",
          )
          ref = api(f"repos/{repository}/git/ref/tags/{tag}")
          require(ref.get("ref") == f"refs/tags/{tag}", "tag ref mismatch")
          require(ref.get("object", {}).get("type") == "tag", "tag is lightweight")
          require(
              ref.get("object", {}).get("sha") == tag_object_sha,
              "verified tag object changed",
          )
          tag_object = api(f"repos/{repository}/git/tags/{tag_object_sha}")
          require(tag_object.get("sha") == tag_object_sha, "tag object SHA mismatch")
          require(tag_object.get("tag") == tag, "annotated tag name mismatch")
          require(
              tag_object.get("tagger", {}).get("name") == signer_name
              and tag_object.get("tagger", {}).get("email") == signer_email,
              "annotated tagger identity mismatch",
          )
          require_verified(tag_object, "tag")
          require(
              tag_object.get("object", {}).get("type") == "commit"
              and tag_object.get("object", {}).get("sha") == source_commit,
              "tag target changed",
          )
          main = api(f"repos/{repository}/git/ref/heads/main")
          require(
              main.get("object", {}).get("sha") == source_commit,
              "current main changed",
          )
          require_release_absent()
          PY

      - name: Create release from exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SDIST_NAME: ${{ needs.prepare.outputs.sdist-name }}
          TAG: ${{ github.ref_name }}
          WHEEL_NAME: ${{ needs.prepare.outputs.wheel-name }}
        run: |
          set -euo pipefail
          CANDIDATE_ROOT="$RUNNER_TEMP/inspectrt-release-candidate"
          gh release create "$TAG" \
            --verify-tag \
            --title "InspectRT $TAG" \
            --notes-file "$CANDIDATE_ROOT/release-notes.md" \
            "$CANDIDATE_ROOT/$WHEEL_NAME" \
            "$CANDIDATE_ROOT/$SDIST_NAME" \
            "$CANDIDATE_ROOT/SHA256SUMS"
