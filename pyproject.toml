[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspectrt"
version = "0.1.0"
description = "A portable runtime for industrial visual inspection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
inspectrt = "inspectrt.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
