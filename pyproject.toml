[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "inspectrt"
version = "0.1.0"
description = "Reproducible feature-memory baseline and portability fixtures for industrial anomaly detection."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Matteo Di Iorio", email = "matteo.di.iorio@icloud.com" },
]
maintainers = [
    { name = "Matteo Di Iorio", email = "matteo.di.iorio@icloud.com" },
]
requires-python = ">=3.11,<3.13"
keywords = [
    "anomaly detection",
    "computer vision",
    "industrial inspection",
    "ML systems",
    "ONNX",
    "PyTorch",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.22.0",
    "onnxruntime==1.28.0",
    "onnxscript>=0.7.1",
]

[project.urls]
Repository = "https://github.com/splicer3/inspectrt"
Documentation = "https://github.com/splicer3/inspectrt/tree/main/docs"
Issues = "https://github.com/splicer3/inspectrt/issues"

[project.scripts]
inspectrt = "inspectrt.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["inspectrt"]

[tool.hatch.build.targets.sdist]
only-include = ["inspectrt", "uv.lock"]
