[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspectrt"
version = "0.1.0"
description = "A portable runtime for industrial visual inspection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
